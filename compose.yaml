services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USER: users
      DB_PASSWORD: users
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
