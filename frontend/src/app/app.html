<h1>Users</h1>

<form [formGroup]="form" (ngSubmit)="save()">
  <label>
    Name
    <input formControlName="name" />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <span class="hint">Name is required</span>
    }
  </label>
  <label>
    Email
    <input formControlName="email" type="email" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="hint">Valid email is required</span>
    }
  </label>
  <label>
    &nbsp;
    <span>
      <button type="submit">{{ editing() ? 'Save' : 'Create' }}</button>
      @if (editing()) {
        <button type="button" (click)="cancel()">Cancel</button>
      }
    </span>
  </label>
</form>

@if (error()) {
  <div class="error">{{ error() }}</div>
}

<table>
  <thead>
    <tr><th>ID</th><th>Name</th><th>Email</th><th></th></tr>
  </thead>
  <tbody>
    @for (user of users(); track user.id) {
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>
          <button type="button" (click)="edit(user)">Edit</button>
          <button type="button" (click)="remove(user)">Delete</button>
        </td>
      </tr>
    } @empty {
      <tr><td colspan="4">No users yet.</td></tr>
    }
  </tbody>
</table>
